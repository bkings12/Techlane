name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Test
        run: go test ./... -count=1

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check OpenAPI route coverage
        run: bash scripts/check-openapi-drift.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build platform image
        run: docker build -f services/api-gateway/Dockerfile -t techlane-platform:ci .

  web-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web-ops, web-portal, web-supplier, web-storefront]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install and build
        working-directory: apps/${{ matrix.app }}
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
          npm run build
          if npm run | grep -qE '^  lint'; then npm run lint; fi

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Assemble debug APKs
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :customer:assembleDebug :supplier:assembleDebug --no-daemon

  docs-present:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check planning docs
        run: |
          test -f docs/product-requirements.md
          test -f docs/commerce-roadmap.md
          test $(ls docs/*.md | wc -l) -ge 25
