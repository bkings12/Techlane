services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: techlane
      POSTGRES_PASSWORD: techlane
      POSTGRES_DB: techlane
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techlane -d techlane"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: techlane
      MINIO_ROOT_PASSWORD: techlanesecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://techlane:techlane@postgres:5432/techlane?sslmode=disable
      JWT_SECRET: dev-change-me-in-production-32chars
      CORS_ORIGINS: "*"
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: auto
      OBJECT_STORAGE_BUCKET: techlane-attachments
      OBJECT_STORAGE_ACCESS_KEY: techlane
      OBJECT_STORAGE_SECRET_KEY: techlanesecret
      WHATSAPP_SERVICE_URL: http://whatsapp:3001
      WHATSAPP_SERVICE_SECRET: dev-whatsapp-service-secret
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      whatsapp:
        condition: service_started

  whatsapp:
    build:
      context: ../services/whatsapp-service
      dockerfile: Dockerfile
    environment:
      WHATSAPP_PORT: "3001"
      WHATSAPP_SERVICE_SECRET: dev-whatsapp-service-secret
      WHATSAPP_INBOUND_URL: http://platform:8080/api/v1/whatsapp/inbound
    volumes:
      - wa_auth:/app/auth_sessions
      - wa_chats:/app/chat_data
    expose:
      - "3001"

volumes:
  pgdata:
  miniodata:
  wa_auth:
  wa_chats:
