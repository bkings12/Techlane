services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techlane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-techlane}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  platform:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      OPS_DOMAIN: ${OPS_DOMAIN:?set OPS_DOMAIN}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?set PORTAL_DOMAIN}
      SUPPLIER_DOMAIN: ${SUPPLIER_DOMAIN:?set SUPPLIER_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web-dist/web-ops:/srv/web-ops:ro
      - ./web-dist/web-portal:/srv/web-portal:ro
      - ./web-dist/web-supplier:/srv/web-supplier:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - platform

volumes:
  pgdata_prod:
  caddy_data:
  caddy_config:
