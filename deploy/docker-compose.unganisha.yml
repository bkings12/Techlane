services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techlane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-techlane}
    volumes:
      - pgdata_unganisha:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Keep MinIO root separate from OBJECT_STORAGE_* (platform may use Cloudflare R2).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-techlane}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata_unganisha:/data
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  whatsapp:
    build:
      context: ../services/whatsapp-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WHATSAPP_PORT: "3001"
      WHATSAPP_SERVICE_SECRET: ${WHATSAPP_SERVICE_SECRET:?set WHATSAPP_SERVICE_SECRET}
      WHATSAPP_INBOUND_URL: http://platform:8080/api/v1/whatsapp/inbound
    volumes:
      - wa_auth_unganisha:/app/auth_sessions
      - wa_chats_unganisha:/app/chat_data
    expose:
      - "3001"
    depends_on:
      platform:
        condition: service_started

  platform:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      WHATSAPP_SERVICE_URL: http://whatsapp:3001
      WHATSAPP_SERVICE_SECRET: ${WHATSAPP_SERVICE_SECRET:?set WHATSAPP_SERVICE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:8090:8080"

volumes:
  pgdata_unganisha:
  miniodata_unganisha:
  wa_auth_unganisha:
  wa_chats_unganisha:
