services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: techlane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techlane-staging}
      POSTGRES_DB: techlane_staging
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techlane -d techlane_staging"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: techlane
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-techlanesecret}
    volumes:
      - minio_staging:/data

  platform:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://techlane:${POSTGRES_PASSWORD:-techlane-staging}@postgres:5432/techlane_staging?sslmode=disable
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: auto
      OBJECT_STORAGE_BUCKET: techlane-staging
      OBJECT_STORAGE_ACCESS_KEY: techlane
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-techlanesecret}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "8080"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
      - "8443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-staging@example.com}
      API_DOMAIN: ${API_DOMAIN:-api.staging.localhost}
      OPS_DOMAIN: ${OPS_DOMAIN:-ops.staging.localhost}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-portal.staging.localhost}
      SUPPLIER_DOMAIN: ${SUPPLIER_DOMAIN:-supplier.staging.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web-dist/web-ops:/srv/web-ops:ro
      - ./web-dist/web-portal:/srv/web-portal:ro
      - ./web-dist/web-supplier:/srv/web-supplier:ro
      - caddy_staging_data:/data
      - caddy_staging_config:/config
    depends_on:
      - platform

volumes:
  pgdata_staging:
  minio_staging:
  caddy_staging_data:
  caddy_staging_config:
